      - region [ref=e42]:
        - heading "Book a car with PowerShell" [level=2] [ref=e43]
        - paragraph [ref=e44]: This example discovers real location/car IDs, chooses an available car, gets a quote, creates a booking, and looks it up. It uses dates relative to today. Read the quote before running the booking lines. Re-running it creates another booking if a car is available.
        - code [ref=e46]: "$base = 'http://127.0.0.1:3000/api' $start = (Get-Date).ToUniversalTime().AddDays(10).ToString('yyyy-MM-dd') $end = (Get-Date).ToUniversalTime().AddDays(13).ToString('yyyy-MM-dd') $locations = Invoke-RestMethod \"$base/locations\" $cars = Invoke-RestMethod \"$base/cars?start=$start&end=$end&availableOnly=true\" if (!@($cars).Count -or !@($locations).Count) { throw 'No available cars or locations' } $trip = @{ carId = $cars[0].id pickupLocationId = $locations[0].id dropoffLocationId = $locations[0].id start = $start; end = $end; driverMode = 'self' addons = @('insurance'); dateOfBirth = '1990-05-20' } $quote = Invoke-RestMethod \"$base/quote\" -Method Post -ContentType 'application/json' -Body ($trip | ConvertTo-Json) $quote | ConvertTo-Json -Depth 10 if (!$quote.carAvailable) { throw 'Car no longer available' } # Run the following only after reviewing the quote. $booking = $trip.Clone() $booking.customerName = 'Demo Customer' $booking.customerEmail = 'demo@example.com' $booking.customerPhone = '+91 90000 00000' $booking.licenceNumber = 'DEMO-12345' $booking.licenceCountry = 'India' $booking.licenceExpiry = (Get-Date).ToUniversalTime().AddYears(2).ToString('yyyy-MM-dd') $booking.paymentMethod = 'pay_at_pickup' $booking.acceptTerms = $true $result = Invoke-RestMethod \"$base/bookings\" -Method Post -ContentType 'application/json' -Body ($booking | ConvertTo-Json) $result | ConvertTo-Json -Depth 10 $email = [uri]::EscapeDataString($booking.customerEmail) Invoke-RestMethod \"$base/bookings/lookup?ref=$($result.ref)&email=$email\" # Optional: cancel the demo booking to release the car. # $cancel = @{ ref = $result.ref; email = $booking.customerEmail } | ConvertTo-Json # Invoke-RestMethod \"$base/bookings/cancel\" -Method Post -ContentType 'application/json' -Body $cancel"
        - paragraph [ref=e47]:
          - text: For a chauffeur trip, set
          - code [ref=e48]: driverMode = 'chauffeur'
          - text: ", use only compatible add-ons from"
          - code [ref=e49]: /api/config
          - text: ", and check"
          - code [ref=e50]: /api/availability/driver
          - text: . Licence fields are not required for chauffeur trips.
      - region [ref=e51]:
        - heading "Complete API reference" [level=2] [ref=e52]
        - paragraph [ref=e53]:
          - text: All API paths below are relative to
          - code [ref=e54]: /api
          - text: . Admin endpoints require a bearer token from
          - code [ref=e55]: POST /api/auth/login
          - text: .
          - link "Open the reference separately" [ref=e56] [cursor=pointer]:
            - /url: /docs/api
          - text: .
        - status [ref=e57]: Reference loaded from docs/API.md.
        - generic [ref=e58]: "# API reference Base path `/api`. JSON in/out. Errors: `{ \"error\": \"message\", \"details\": { \"field\": \"reason\" } }` (details only on validation errors). Status codes: 400 validation, 401/403 auth, 404 not found, 409 conflict (availability), 413 too large, 429 rate limited. ## Public | Method & path | Description | |---|---| | `GET /health` | `{status, env, time}` for probes | | `GET /config` | Public business info (phone, socials), rental rules, add-on catalog, categories | | `GET /locations` | Pick-up/drop-off locations | | `GET /cars` | Fleet. Query: `category, brand (maruti-suzuki, toyota, hyundai, kia, tata, mahindra), transmission, fuel (petrol, diesel, hybrid, electric, cng), seats (min), minPrice, maxPrice, q, sort (price_asc, price_desc, rating, newest), start, end (adds `available`), availableOnly=true` | | `GET /cars/:id` | Car + rating `{average,count}` + latest reviews | | `POST /cars/:id/reviews` | `{rating 1-5, author, comment?}` → new average. Rate limited | | `GET /availability/driver?start&end` | `{available, driversFree, dailyRate}` | | `POST /quote` | Price a trip (no customer data). Body below. Returns `{lines[], subtotal, tax, total, deposit, carAvailable, driverAvailable}` | | `POST /bookings` | Create booking. Returns booking incl. `ref` (e.g. `FG-1A2B3C4D`). 409 if car/chauffeur unavailable | | `GET /bookings/lookup?ref&email` | View a booking (both must match) | | `POST /bookings/cancel` | `{ref, email}`; only `confirmed` bookings starting after today | | `POST /feedback` | `{name, email, rating, message, allowPublish}`; shown as a testimonial only after admin approval | | `GET /testimonials` | Approved, consented testimonials + average | | `GET /reviews?limit=5` | Public reviews (imported Google reviews + approved feedback), newest first, with `summary {average, count, distribution, demo}` and `googleUrl`. Omit `limit` for all (max 500) | | `POST /chat` | `{message}` → `{text, suggestions[], handoff, intent}` | ### Trip body (`/quote`, `/bookings`) ```json { \"carId\": 2, \"pickupLocationId\": 1, \"dropoffLocationId\": 2, \"start\": \"2026-11-10\", \"end\": \"2026-11-13\", \"driverMode\": \"self | chauffeur\", \"addons\": [\"insurance\", \"child_seat\", \"gps\", \"wifi\", \"extra_driver\"], \"dateOfBirth\": \"1990-05-20\" } ``` `/bookings` additionally requires: `customerName, customerEmail, customerPhone, dateOfBirth, acceptTerms: true`, and for `self`: `licenceNumber, licenceCountry, licenceExpiry`; optional `paymentMethod (pay_at_pickup | pay_online_demo)`, `notes`. Dates are `YYYY-MM-DD`; the return date is exclusive; max rental length is `MAX_RENTAL_DAYS`. ## Admin (Authorization: `Bearer <token>`) | Method & path | Description | |---|---| | `POST /auth/login` | `{email, password}` → `{token, user}` (rate limited) | | `GET /admin/summary` | KPIs | | `GET /admin/cars` | All fleet records, including inactive cars; admin DTO uses database field names such as `price_per_day` | | `POST /admin/cars` | Create a car; returns `{id}`. Body below | | `PUT /admin/cars/:id` | Replace car fields using the full create body; optional `active: false` hides it | | `DELETE /admin/cars/:id` | Hide a car (soft delete; history kept) | | `GET /admin/bookings?status=` | List bookings | | `PATCH /admin/bookings/:id` | `{status: confirmed|active|completed|cancelled}` | | `GET /admin/drivers` | All chauffeurs | | `POST /admin/drivers` | `{name, languages, yearsExperience}`; returns `{id}` | | `PATCH /admin/drivers/:id` | `{active: boolean}` | | `GET /admin/feedback` | Latest 200 feedback entries, including unapproved | | `PATCH /admin/feedback/:id` | `{approved: boolean}` | | `DELETE /admin/feedback/:id` | Delete feedback | | `GET /admin/reviews` | Latest 200 per-car ratings | | `DELETE /admin/reviews/:id` | Delete a per-car rating | | `POST /admin/reviews/import` | `{reviews: [{author, rating, text?, date?, url?}], replace?: boolean}` (1-500). Duplicates skipped; returns `{added, skippedDuplicates}` | ### Full car create/update body ```json { \"brand\": \"kia\", \"make\": \"Kia\", \"model\": \"Demo Car\", \"year\": 2026, \"category\": \"suv\", \"body\": \"suv\", \"color\": \"#112233\", \"transmission\": \"automatic\", \"fuel\": \"petrol\", \"seats\": 5, \"bags\": 3, \"pricePerDay\": 3000, \"deposit\": 5000, \"description\": \"Demo vehicle\", \"features\": [\"Air conditioning\"], \"image\": \"/img/cars/demo.webp\" } ``` Use catalogs from `GET /config` for brands/categories. Bodies: `hatch, sedan, suv, sports, van`. Image is optional; a provided path must point to an image file already deployed in `public/img/cars/`. There is no file-upload API. The create body uses camelCase; do not send an admin GET response back unchanged. ### Complete self-drive booking body Choose actual IDs from `GET /cars` and `GET /locations`, and replace dates with future dates. ```json { \"carId\": 2, \"pickupLocationId\": 1, \"dropoffLocationId\": 1, \"start\": \"2026-11-10\", \"end\": \"2026-11-13\", \"driverMode\": \"self\", \"addons\": [\"insurance\"], \"customerName\": \"Demo Customer\", \"customerEmail\": \"demo@example.com\", \"customerPhone\": \"+91 90000 00000\", \"dateOfBirth\": \"1990-05-20\", \"licenceNumber\": \"DEMO-12345\", \"licenceCountry\": \"India\", \"licenceExpiry\": \"2030-12-31\", \"paymentMethod\": \"pay_at_pickup\", \"acceptTerms\": true } ``` Call `POST /quote` with the trip fields first, then `POST /bookings` with the full body. Save the returned `ref`. Look up using `GET /bookings/lookup?ref=FG-...&email=demo%40example.com`. Cancel using `POST /bookings/cancel` with `{\"ref\":\"FG-...\",\"email\":\"demo@example.com\"}`. Cancellation requires a confirmed booking starting after today. URL-encode query values. For chauffeur bookings, change `driverMode` to `chauffeur`, omit licence fields, and use only add-ons without `selfOnly: true` from `/config`. `pay_online_demo` does not process payments. Booking creation immediately confirms the booking; no email or SMS is sent. Do not put real customer or licence details into a publicly shared Dev environment. ### Limits and missing data-entry APIs Bodies are limited to 20 KB, including review imports (even though imports allow up to 500 entries). Guest writes, booking lookups, login and chat are rate limited; handle `429` and its retry headers. There are no APIs to create/update locations, manage admin accounts/passwords, upload photos, process payments or send booking notifications. Locations are currently seeded in `src/seed.js`. ## Examples On Windows, open the Dev-only `/docs` tab for a runnable PowerShell example that discovers IDs and uses relative future dates. The following shell examples require Bash and future dates: ```bash curl localhost:3000/api/cars?fuel=electric curl -X POST localhost:3000/api/quote -H 'Content-Type: application/json' \\ -d '{\"carId\":2,\"pickupLocationId\":1,\"dropoffLocationId\":1,\"start\":\"2026-11-10\",\"end\":\"2026-11-13\",\"addons\":[\"insurance\"]}' TOKEN=$(curl -s -X POST localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{\"email\":\"admin@localhost.test\",\"password\":\"...\"}' | node -pe \"JSON.parse(require('fs').readFileSync(0)).token\") curl -H \"Authorization: Bearer $TOKEN\" localhost:3000/api/admin/summary ```"
      - region [ref=e59]:
        - heading "Before public production use" [level=2] [ref=e60]
        - list [ref=e61]:
          - listitem [ref=e62]: Integrate a real payment provider and payment verification if accepting online payments; add email/SMS confirmations if required.
          - listitem [ref=e63]: There are no location-management APIs or image-upload APIs. Locations are seeded in code, and car photos must be deployed as files.
          - listitem [ref=e64]: Verify prices, deposits, tax, locations, chauffeurs, social links and rental/privacy terms; some content is inferred or demo data.
          - listitem [ref=e65]: Configure durable hosting, HTTPS, strong admin/JWT secrets, persistent storage, monitoring and scheduled backups. SQLite requires a single app instance with its local persistent disk.
          - listitem [ref=e66]: A public tunnel exposes the whole app, including guest write APIs and the admin sign-in. Share only synthetic demo data; use an access-controlled tunnel for a development preview.
        - paragraph [ref=e67]:
          - text: Docs and their supporting files are served only when
          - code [ref=e68]: APP_ENV=dev
          - text: ; they are unavailable in PROD even by direct URL.
