<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Before you book | FirstGear Car Rentals</title>
  <meta name="description" content="Read our short checklist, then message us on WhatsApp to reserve your car.">
  <meta name="theme-color" content="#0a0a12">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/checklist.js" defer></script>
</head>
<body class="page-solid">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-head"><div class="container"><span class="eyebrow">Before you book</span><h1>Rental checklist</h1><p class="lead">There is no online booking or payment. Read these points, tick each one, then message us on WhatsApp and we will confirm your car.</p></div></section>
    <div class="container checklist-layout">
      <section class="panel" aria-labelledby="cl-trip-title">
        <h2 id="cl-trip-title">Your enquiry</h2>
        <div id="cl-trip" aria-live="polite"></div>
      </section>
      <form class="panel" id="checklist-form" novalidate aria-labelledby="cl-list-title">
        <h2 id="cl-list-title">Please confirm</h2>
        <ul class="checklist" id="cl-items"></ul>
        <p class="muted" id="cl-progress" aria-live="polite"></p>
        <div class="checklist-actions">
          <a class="btn" id="cl-whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true">Continue on WhatsApp</a>
          <a class="btn ghost" id="cl-call" href="#"></a>
        </div>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
