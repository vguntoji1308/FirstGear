<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer reviews | FirstGear Car Rentals</title>
  <meta name="description" content="Read what FirstGear Car Rentals customers say about our cars, service and prices.">
  <meta name="theme-color" content="#0a0a12">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/reviews-ui.js" defer></script>
  <script src="/js/reviews.js" defer></script>
</head>
<body class="page-solid">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-head" id="top">
      <div class="container">
        <span class="eyebrow">Customer reviews</span>
        <h1>What our customers say</h1>
        <p class="lead">Honest feedback from people who rented with us. Highlighted words show what they liked.</p>
      </div>
    </section>
    <div class="container rv-page">
      <div class="rv-summary panel" id="rv-summary" aria-live="polite"></div>
      <div class="tabs" role="group" aria-label="Review source">
        <a class="btn small" id="google-rate-link" href="#" target="_blank" rel="noopener noreferrer">Rate Us on Google</a>
        <button type="button" data-source="website" aria-pressed="false">Website feedback &amp; imported reviews</button>
      </div>
      <div class="rv-legend" aria-label="Highlight colour key">
        <span class="hl hl-pos">Praise</span><span class="hl hl-svc">Service</span><span class="hl hl-price">Price</span><span class="hl hl-car">Car</span>
      </div>
      <div id="rv-note" aria-live="polite"></div>
      <p><button class="btn ghost small" id="rv-refresh" type="button">Refresh reviews</button></p>
      <div id="rv-error" role="status"></div>
      <div class="rv-list" id="rv-list" aria-live="polite"></div>
      <p class="rv-footer"><a class="btn ghost" id="google-link" href="#" target="_blank" rel="noopener noreferrer">See all reviews on Google</a> <a class="btn" href="/#feedback">Leave your own feedback</a></p>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
