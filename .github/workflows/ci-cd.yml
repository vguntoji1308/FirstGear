# GitHub Actions equivalent of azure-pipelines.yml:
# build + test -> Docker image (GHCR) -> deploy Dev (auto) -> deploy PROD (manual approval).
#
# One-time setup (see docs/DEPLOYMENT.md):
#   Settings > Environments: create "dev" and "production". On "production" enable Required reviewers
#   (this is what enforces the manual approval).
#   Per-environment secrets: AZURE_WEBAPP_PUBLISH_PROFILE, plus variables WEBAPP_NAME and WEBAPP_HOST.
#   App settings (JWT_SECRET, ADMIN_PASSWORD, BUSINESS_PHONE ...) are configured on the host itself;
#   no secret is baked into the image. Swap the deploy step for any other host; the image is portable.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  image:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

  deploy-dev:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://${{ vars.WEBAPP_HOST }}
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
      - name: Smoke test (health)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://${{ vars.WEBAPP_HOST }}/api/health" && exit 0
            sleep 10
          done
          echo "Health check failed"; exit 1

  deploy-prod:
    needs: [image, deploy-dev]
    runs-on: ubuntu-latest
    environment:          # "production" has Required reviewers => the job pauses for manual approval
      name: production
      url: https://${{ vars.WEBAPP_HOST }}
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
      - name: Smoke test (health)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://${{ vars.WEBAPP_HOST }}/api/health" && exit 0
            sleep 10
          done
          echo "Health check failed"; exit 1
